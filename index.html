<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LiftPlan">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>LiftPlan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap">
<style>
/* Clean & airy: white surfaces, soft shadows instead of borders, one calm teal accent, photo-forward cards.
   Home = Today (current gym + today's session). Desktop ≥ 720px shows the app inside an iPhone frame. */
:root{
  --bg:#f6f7f6; --card:#ffffff; --fill:#eef0ef; --fill2:#e0e4e2; --label:#262b29; --sec:#7a827e; --ter:#b1b7b4; --sep:rgba(38,43,41,.07);
  --tint:#4a9d90; --tint-soft:#e8f2f0; --tint-fg:#ffffff; --green:#5fae82; --orange:#d9a05b; --red:#d47a74; --yellow:#dcc07a; --bar:rgba(246,247,246,.86);
  --hero-a:#6fb3a6; --hero-b:#5a8fa3;
  --shadow:0 1px 2px rgba(38,43,41,.03),0 10px 30px rgba(38,43,41,.05); --radius:20px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --display:"Fraunces","Iowan Old Style","Palatino",Georgia,serif;
  --t-blush:#e9d6cc; --t-sage:#d8dfc8; --t-ink:#2f3330; --t-sand:#e4d7c0; --t-sky:#d7e0e4; --t-plum:#e0d4dc;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121514; --card:#1b1f1e; --fill:#252a28; --fill2:#333937; --label:#e6e9e7; --sec:#9ca3a0; --ter:#636966; --sep:rgba(255,255,255,.07);
  --tint:#7cc4b6; --tint-soft:#1d2f2b; --tint-fg:#10201c; --green:#7fc49c; --orange:#d9ad74; --red:#d98f8a; --yellow:#d9c58a; --bar:rgba(18,21,20,.86);
  --hero-a:#4f8c80; --hero-b:#3f6c82;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121514; --card:#1b1f1e; --fill:#252a28; --fill2:#333937; --label:#e6e9e7; --sec:#9ca3a0; --ter:#636966; --sep:rgba(255,255,255,.07);
  --tint:#7cc4b6; --tint-soft:#1d2f2b; --tint-fg:#10201c; --green:#7fc49c; --orange:#d9ad74; --red:#d98f8a; --yellow:#d9c58a; --bar:rgba(18,21,20,.86);
  --hero-a:#4f8c80; --hero-b:#3f6c82;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.3); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:16px;line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.01em}

#app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--bg)}
.status{display:none}
@media (min-width:720px){
  body{background:#d9dedb;display:grid;place-items:center;padding:24px}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body{background:#1c201e} }
  :root[data-theme="dark"] body{background:#1c201e}
  #app{width:393px;height:852px;max-height:100%;border:11px solid #0d0d0f;border-radius:56px;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 2px #3a3a3e;overflow:hidden}
  .status{display:flex;justify-content:space-between;align-items:center;height:54px;padding:0 30px 0 34px;font-size:16px;font-weight:600;flex:none;position:relative}
  .status::after{content:"";position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:35px;background:#0d0d0f;border-radius:20px}
  .status .ico{display:flex;gap:6px;align-items:center}
  .status svg{height:12px;width:auto;fill:currentColor}
  .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--label);opacity:.85;z-index:9}
}
.navbar{flex:none;background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-top:env(safe-area-inset-top,0px);z-index:5;position:relative}
.navbar .inner{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:10px 20px 8px;min-height:54px}
.navbar h1{font-size:26px;font-weight:600;letter-spacing:-.4px;line-height:1.15}
.navbar .sub{display:block;font-size:13.5px;font-weight:400;color:var(--sec);letter-spacing:0;margin-top:3px}
.navbar.compact h1{font-size:16px;font-weight:500;text-align:center;flex:1;letter-spacing:-.1px}
.navbar .actions{display:flex;gap:14px;align-items:center;padding-bottom:5px}
.navbar.compact .actions{padding-bottom:0}
.navbar .hair{height:1px;background:var(--sep);opacity:0;transition:opacity .2s}
.navbar.scrolled .hair{opacity:1}
.tb{background:none;border:0;color:var(--tint);font-size:15.5px;font-weight:400;padding:0;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.tb:active{opacity:.6}
.tb.bold{font-weight:500}
.tb.red{color:var(--red)}
.tb:disabled{color:var(--ter)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px calc(100px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.navbar[style*="display: none"] + main{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.view{display:flex;flex-direction:column;gap:26px;padding-top:6px}
.view.enter{animation:viewin .25s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Sections: titled, no boxes */
.grp{display:flex;flex-direction:column;gap:10px;min-width:0}
.grp > h2{font-size:16px;font-weight:500;padding:0 2px;color:var(--label);text-transform:none;letter-spacing:-.1px;display:flex;align-items:baseline;justify-content:space-between}
.grp > h2 .link{font-size:13.5px;font-weight:400;color:var(--tint);cursor:pointer}
.grp > .foot{font-size:13px;color:var(--sec);padding:0 2px;line-height:1.4}
.inset{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.cell{display:flex;align-items:center;gap:12px;min-height:48px;padding:11px 16px;position:relative;min-width:0}
.cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--sep)}
.cell .body{flex:1;min-width:0}
.cell .t{font-size:15.5px;font-weight:450}
.cell .s{font-size:13.5px;color:var(--sec);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .chev{color:var(--ter);font-size:20px;line-height:1}
.cell .val{color:var(--sec);font-size:16px}
.cell.tap{cursor:pointer}
.cell.tap{transition:background .2s var(--ease)}
.cell.tap:active{background:var(--fill)}
.cell.btn-cell{color:var(--tint);justify-content:center;cursor:pointer;font-weight:450}
.cell.btn-cell.red{color:var(--red)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.cap{background:var(--tint);color:var(--tint-fg);border:0;border-radius:999px;padding:8px 16px;font-size:14.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:transform .15s var(--ease),opacity .15s}
.cap:active{transform:scale(.96);opacity:.9}
.cap.gray{background:var(--tint-soft);color:var(--tint)}
.cap.sm{padding:5px 12px;font-size:14px}
.cap:disabled{opacity:.4}
.icon-btn{background:var(--fill);border:0;width:30px;height:30px;border-radius:50%;color:var(--sec);display:grid;place-items:center;cursor:pointer;font-size:13px;flex:none}
.empty{color:var(--sec);text-align:center;padding:28px 16px;font-size:15px}
.pill{font-size:13px;color:var(--green);font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--sec)}
.small{font-size:14px}
.big{background:var(--tint);color:var(--tint-fg);border:0;border-radius:18px;padding:16px;font-size:16.5px;font-weight:500;width:100%;cursor:pointer;box-shadow:0 8px 22px rgba(74,157,144,.22);transition:transform .18s var(--ease),box-shadow .18s}
.big:active{transform:scale(.985);box-shadow:0 4px 12px rgba(74,157,144,.18)}
.big.gray{background:var(--tint-soft);color:var(--tint);box-shadow:none}
.big.red{background:var(--fill);color:var(--red);box-shadow:none}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{background:none;border:0;padding:0;width:100%;min-width:0;text-align:right;color:var(--label)}
textarea{text-align:left;font-family:var(--mono);font-size:12px;min-height:140px;padding:12px 16px;background:var(--card)}
.field{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;position:relative}
.field + .field::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--sep)}
.field label{flex:none;font-size:16px}
.field input,.field select{flex:1}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px;cursor:pointer;color:var(--sec);font-size:13.5px;font-weight:500}
.seg button.on{background:var(--card);color:var(--label);box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:600}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--tint)}
.switch.on::after{transform:translateX(20px)}

/* Today (home) */
.gymhero{background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);color:#fff;border-radius:26px;padding:20px 22px;box-shadow:0 12px 32px rgba(74,157,144,.22);position:relative;overflow:hidden;cursor:pointer;transition:transform .2s var(--ease)}
.gymhero:active{transform:scale(.99)}
.gymhero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.gymhero .k{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.gymhero .n{font-size:22px;font-weight:500;letter-spacing:-.3px;margin-top:4px;line-height:1.2}
.gymhero .a{font-size:14px;opacity:.85;margin-top:2px}
.gymhero .eqrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;position:relative}
.gymhero .eqrow span{font-size:12.5px;font-weight:400;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px}
.gymhero .sw{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:450;cursor:pointer}
.session{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.session .eyebrow{font-size:12px;font-weight:500;color:var(--tint);text-transform:uppercase;letter-spacing:.06em}
.session .name{font-size:23px;font-weight:500;letter-spacing:-.3px;line-height:1.15}
.session .meta{font-size:14px;color:var(--sec)}
.collage{display:flex;align-items:center}
.collage .extile,.collage .extile.photo{border-radius:50%;box-shadow:0 0 0 3px var(--card);margin-left:-10px}
.collage .extile:first-child,.collage .extile.photo:first-child{margin-left:0}
.collage .extile.photo > img,.collage .extile.photo > .extile{border-radius:50%}
.collage .more{margin-left:8px;font-size:13px;color:var(--sec)}
.exlist{display:flex;flex-direction:column;gap:6px}
.exlist div{display:flex;justify-content:space-between;font-size:14.5px}
.exlist .rx{color:var(--sec);font-family:var(--mono);font-size:13px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:4px 20px 8px}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:168px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px;cursor:pointer;transition:transform .2s var(--ease)}
.mini:active{transform:scale(.97)}
.mini .d{font-size:12px;font-weight:500;color:var(--sec);text-transform:uppercase;letter-spacing:.05em}
.mini .n{font-size:16px;font-weight:500;margin-top:4px;letter-spacing:-.1px}
.mini .m{font-size:13px;color:var(--sec);margin-top:2px}
.weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.weekrow .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--sec);text-transform:uppercase;cursor:pointer;background:none;border:0;padding:0}
.weekrow .c{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14.5px;font-weight:450;color:var(--label);background:var(--fill);transition:transform .2s var(--ease)}
.weekrow .c.done{background:var(--tint);color:var(--tint-fg)}
.weekrow .c.plan{box-shadow:inset 0 0 0 2px var(--tint);background:var(--card)}
.weekrow .c.today{outline:1.5px solid var(--sec);outline-offset:2px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{background:var(--card);border:0;border-radius:18px;box-shadow:var(--shadow);padding:14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:450;color:var(--label);transition:transform .2s var(--ease)}
.quick button:active{transform:scale(.97)}
.quick .ic{width:34px;height:34px;border-radius:10px;background:var(--tint-soft);color:var(--tint);display:grid;place-items:center;font-size:16px;flex:none}


/* Home hub (storefront-style navigation) */
.hubbar{display:flex;align-items:center;gap:10px;padding:2px 0 4px}
.hubbar .loc{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;background:none;border:0;padding:0;cursor:pointer;color:var(--label);min-width:0}
.hubbar .loc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.hubbar .loc i{color:var(--sec);font-style:normal;font-size:13px}
.hubbar .sp{flex:1}
.hubbar .ib{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);border:0;display:grid;place-items:center;color:var(--label);cursor:pointer}
.hubbar .ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:none;width:calc(100% - 0px);scroll-snap-align:center;border-radius:26px;overflow:hidden;position:relative;min-height:190px;background:#2b3330;color:#fff;display:flex;box-shadow:var(--shadow)}
.slide .txt{padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:8px;flex:1;min-width:0;position:relative;z-index:1}
.slide .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.slide .h{font-family:var(--display);font-size:26px;font-weight:500;line-height:1.15;letter-spacing:-.2px}
.slide .m{font-size:13.5px;opacity:.8}
.slide .cta{align-self:flex-start;margin-top:6px;background:#fff;color:#1f2624;border:0;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer}
.slide .img{width:46%;flex:none;position:relative;overflow:hidden}
.slide .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%}
.slide .img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#2b3330 0%,rgba(43,51,48,0) 45%);z-index:1}
.slide.teal{background:linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.slide.teal .img::before{background:linear-gradient(90deg,var(--hero-a) 0%,rgba(0,0,0,0) 50%)}
.slide .stat{display:flex;gap:18px;margin-top:4px}
.slide .stat b{display:block;font-size:22px;font-weight:500;letter-spacing:-.3px}
.slide .stat span{font-size:12px;opacity:.75}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--fill2);transition:background .2s,transform .2s}
.dots i.on{background:var(--label);transform:scale(1.25)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ftile{position:relative;border-radius:22px;overflow:hidden;min-height:118px;display:flex;align-items:center;justify-content:flex-end;padding:14px;cursor:pointer;background:var(--tbg);color:var(--tfg,var(--label));box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.ftile:active{transform:scale(.97)}
.ftile .pic{position:absolute;left:0;top:0;bottom:0;width:56%;-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 100%);mask-image:linear-gradient(90deg,#000 45%,transparent 100%)}
.ftile .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.ftile .pic .extile{width:100%!important;height:100%!important;border-radius:0}
.ftile .pic .extile > svg:first-child{padding:18%}
.ftile .pic .extile .badge{display:none}
.ftile .lbl{position:relative;z-index:1;font-family:var(--display);font-size:19px;font-weight:500;letter-spacing:-.1px;text-align:right}
.ftile .lbl small{display:block;font-size:12px;font-weight:400;opacity:.7;margin-top:2px}
.others{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 6px}
.others::-webkit-scrollbar{display:none}
.otile{flex:none;width:112px;cursor:pointer;transition:transform .2s var(--ease)}
.otile:active{transform:scale(.96)}
.otile .box{height:104px;border-radius:20px;background:var(--tbg);display:grid;place-items:center;font-size:34px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.otile .box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.otile .box .extile{width:64px!important;height:64px!important}
.otile .n{text-align:center;font-size:13.5px;font-weight:450;margin-top:8px}
.otile .n small{display:block;font-size:11.5px;color:var(--sec);font-weight:400}
/* Home-only vintage look */
/* Home: vintage paper in light mode, aged-dark in dark mode — full token sets so text always contrasts. */
#app.home{--bg:#f4f1ea; --card:#fffdf8; --fill:#ebe7de; --fill2:#d9d4c8; --label:#1f211e; --sec:#5f635c; --ter:#a39f94; --sep:rgba(31,33,30,.09);
  --tint:#3f7f74; --tint-soft:#e2ece8; --tint-fg:#ffffff; --bar:rgba(244,241,234,.9); --hero-a:#6f9f93; --hero-b:#5e7f8f;
  --t-blush:#e9d6cc; --t-sage:#d8dfc8; --t-ink:#2f3330; --t-sand:#e4d7c0; --t-sky:#d7e0e4; --t-plum:#e0d4dc; --orb:#1f211e; --orb-fg:#ffffff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #app.home{--bg:#171613; --card:#201f1b; --fill:#2a2925; --fill2:#3a3832; --label:#ece7dc; --sec:#a8a295; --ter:#6d685e; --sep:rgba(236,231,220,.09);
  --tint:#8fc2b4; --tint-soft:#223430; --tint-fg:#0f1a17; --bar:rgba(23,22,19,.9); --hero-a:#4d7f74; --hero-b:#3f5f70;
  --t-blush:#4a3a35; --t-sage:#36402f; --t-ink:#2a2d2a; --t-sand:#46402f; --t-sky:#303a40; --t-plum:#3f3540; --orb:#ece7dc; --orb-fg:#171613} }
:root[data-theme="dark"] #app.home{--bg:#171613; --card:#201f1b; --fill:#2a2925; --fill2:#3a3832; --label:#ece7dc; --sec:#a8a295; --ter:#6d685e; --sep:rgba(236,231,220,.09);
  --tint:#8fc2b4; --tint-soft:#223430; --tint-fg:#0f1a17; --bar:rgba(23,22,19,.9); --hero-a:#4d7f74; --hero-b:#3f5f70;

function ensureLibrary(){
  const have = new Set(Object.values(DB.exercises).map(e=>norm(e.name)));
  for(const [n,g,eq] of SEED_EX){ if(!have.has(norm(n))){ const id=uid(); DB.exercises[id]={id,name:n,group:g,equip:eq,custom:false}; } }
  for(const e of Object.values(DB.exercises)){ if(!e.equip){ const m=e.name.match(/\(([^)]+)\)/); e.equip=m?m[1].toLowerCase():'other'; } }
}

function seed(){
  ensureLibrary();
  const t = parseDay(todayKey()); const back = (t.getDay()+6)%7; const monday = t.getDay()===0 ? todayKey() : addDays(todayKey(), -back);
  const imp = parsePlan(SAMPLE_PLAN, 'Sample');
  commitPlan(imp, { startDate: monday, repeat: 2, replace:true });
  const bench = findEx('Bench Press (Barbell)').id, squat = findEx('Squat (Barbell)').id, row = findEx('Bent Over Row (Barbell)').id, dl = findEx('Deadlift (Barbell)').id;
  const hist = [[-28,'Upper A',[[bench,175,5,4],[row,125,8,4]]],[-27,'Lower A',[[squat,215,5,4]]],[-24,'Lower B',[[dl,255,5,3]]],
                [-21,'Upper A',[[bench,180,5,4],[row,130,8,4]]],[-20,'Lower A',[[squat,220,5,4]]],[-17,'Lower B',[[dl,265,5,3]]],
                [-14,'Upper A',[[bench,180,5,4],[row,135,8,4]]],[-13,'Lower A',[[squat,225,5,4]]],[-10,'Lower B',[[dl,270,5,3]]],
                [-7,'Upper A',[[bench,185,5,4],[row,135,8,4]]],[-6,'Lower A',[[squat,225,5,4]]],[-3,'Lower B',[[dl,275,5,3]]]];
  for(const [off,name,exs] of hist){
    const start = parseDay(addDays(todayKey(), off)); start.setHours(6,30);
    const w = { id:uid(), name, startedAt:start.getTime(), endedAt:start.getTime()+58*60000, notes:'', sample:true, sets:[] };
    exs.forEach(([ex,wt,reps,n],ei)=>{ for(let i=0;i<n;i++) w.sets.push({id:uid(),ex,order:ei,idx:i,weight:wt,reps,rpe:null,done:true,at:w.endedAt}); });
    DB.workouts.push(w);
  }
  // One sample gym so the equipment map has something to show; sample workouts are tagged to it.
  const gym={id:uid(),name:'Sample Gym — Lakeview',chain:null,address:'Chicago, IL (example)',createdAt:Date.now(),sample:true,equipment:{}};
  ['Barbell + plates','Dumbbells','Flat bench','Adjustable bench','Squat rack / power rack','Deadlift platform','Leg press','Leg curl','Lat pulldown (cable)','Seated cable row','Cable station / crossover','Pull-up bar','Treadmill','Rower']
    .forEach(t=>{ gym.equipment[t]={firstSeen:Date.now(),lastSeen:Date.now(),count:0,source:'explicit',broken:false}; });
  DB.gyms[gym.id]=gym; DB.settings.currentGym=gym.id;
  DB.workouts.forEach(w=>{ w.gym=gym.id; w.sets.forEach(s=>reqFor(DB.exercises[s.ex]).forEach(t=>upsertEq(gym,t,'logged'))); });
  // Make sure the first open shows a session today.
  if(!DB.scheduled.some(x=>x.date===todayKey())){ const r=Object.values(DB.routines).find(x=>x.name==='Upper A'); if(r){ DB.scheduled.push({id:uid(),date:todayKey(),routine:r.id,plan:'',week:1,time:null,duration:60,done:false}); DB.scheduled.sort((a,b)=>a.date.localeCompare(b.date)); } }
  DB.meta.seeded = true; save();
}

const EX_MEDIA = {"Bench Press (Barbell)":{"id":"Barbell_Bench_Press_-_Medium_Grip","steps":["Lie back on a flat bench. Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","From the starting position, breathe in and begin coming down slowly until the bar touches your middle chest.","After a brief pause, push the bar back to the starting position as you breathe out. Focus on pushing the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position at the top of the motion, hold for a second and then start coming down slowly again. Tip: Ideally, lowering the weight should take about twice as long as raising it.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"muscles":["chest","shoulders","triceps"]},"Bench Press (Dumbbell)":{"id":"Dumbbell_Bench_Press","steps":["Lie down on a flat bench with a dumbbell in each hand resting on top of your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help raise the dumbbells up, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. The dumbbells should be just to the sides of your chest, with your upper arm and forearm creating a 90 degree angle. Be sure to maintain full control of the dumbbells at all times. This will be your starting position.","Then, as you breathe out, use your chest to push the dumbbells up. Lock your arms at the top of the lift and squeeze your chest, hold for a second and then begin coming down slowly. Tip: Ideally, lowering the weight should take about twice as long as raising it.","Repeat the movement for the prescribed amount of repetitions of your training program."],"muscles":["chest","shoulders","triceps"]},"Incline Bench Press (Barbell)":{"id":"Barbell_Incline_Bench_Press_-_Medium_Grip","steps":["Lie back on an incline bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on you upper chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly again. Tip: it should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"muscles":["chest","shoulders","triceps"]},"Incline Bench Press (Dumbbell)":{"id":"Incline_Dumbbell_Press","steps":["Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.","Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Be sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest.","Lock your arms at the top, hold for a second, and then start slowly lowering the weight. Tip Ideally, lowering the weights should take about twice as long as raising them.","Repeat the movement for the prescribed amount of repetitions."],"muscles":["chest","shoulders","triceps"]},"Decline Bench Press (Barbell)":{"id":"Decline_Barbell_Bench_Press","steps":["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.","As you breathe in, come down slowly until you feel the bar on your lower chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up).","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"muscles":["chest","shoulders","triceps"]},"Chest Press (Machine)":{"id":"Leverage_Chest_Press","steps":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom or middle of the pectorals at the beginning of the motion.","Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"muscles":["chest","shoulders","triceps"]},"Chest Fly (Dumbbell)":{"id":"Dumbbell_Flyes","steps":["Lie down on a flat bench with a dumbbell on each hand resting on top of your thighs. The palms of your hand will be facing each other.","Then using your thighs to help raise the dumbbells, lift the dumbbells one at a time so you can hold them in front of you at shoulder width with the palms of your hands facing each other. Raise the dumbbells up like you're pressing them, but stop and hold just before you lock out. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions."],"muscles":["chest"]},"Chest Fly (Machine)":{"id":"Butterfly","steps":["Sit on the machine with your back flat on the pad.","Take hold of the handles. Tip: Your upper arms should be positioned parallel to the floor; adjust the machine accordingly. This will be your starting position.","Push the handles together slowly as you squeeze your chest in the middle. Breathe out during this part of the motion and hold the contraction for a second.","Return back to the starting position slowly as you inhale until your chest muscles are fully stretched.","Repeat for the recommended amount of repetitions."],"muscles":["chest"]},"Cable Crossover":{"id":"Cable_Crossover","steps":["To get yourself into the starting position, place the pulleys on a high position (above your head), select the resistance to be used and hold the pulleys in each hand.","Step forward in front of an imaginary straight line between both pulleys while pulling your arms together in front of you. Your torso should have a small forward bend from the waist. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, extend your arms to the side (straight out at both sides) in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms and torso should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you breathe out. Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the starting position and repeat the movement for the prescribed amount of repetitions."],"muscles":["chest","shoulders"]},"Push Up":{"id":"Pushups","steps":["Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length.","Next, lower yourself downward until your chest almost touches the floor as you inhale.","Now breathe out and press your upper body back up to the starting position while squeezing your chest.","After a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed."],"muscles":["chest","shoulders","triceps"]},"Chest Dip":{"id":"Dips_-_Chest_Version","steps":["For this exercise you will need access to parallel bars. To get yourself into the starting position, hold your body at arms length (arms locked) above the bars.","While breathing in, lower yourself slowly with your torso leaning forward around 30 degrees or so and your elbows flared out slightly until you feel a slight stretch in the chest.","Once you feel the stretch, use your chest to bring your body back to the starting position as you breathe out. Tip: Remember to squeeze the chest at the top of the movement for a second.","Repeat the movement for the prescribed amount of repetitions."],"muscles":["chest","shoulders","triceps"]},"Floor Press (Barbell)":{"id":"Floor_Press","steps":["Adjust the j-hooks so they are at the appropriate height to rack the bar. Begin lying on the floor with your head near the end of a power rack. Keeping your shoulder blades pulled together; pull the bar off of the hooks.","Lower the bar towards the bottom of your chest or upper stomach, squeezing the bar and attempting to pull it apart as you do so. Ensure that you tuck your elbows throughout the movement. Lower the bar until your upper arm contacts the ground and pause, preventing any slamming or bouncing of the weight.","Press the bar back up as fast as you can, keeping the bar, your wrists, and elbows in line as you do so."],"muscles":["triceps","chest","shoulders"]},"Deadlift (Barbell)":{"id":"Barbell_Deadlift","steps":["Stand in front of a loaded barbell.","While keeping the back as straight as possible, bend your knees, bend forward and grasp the bar using a medium (shoulder width) overhand grip. This will be the starting position of the exercise. Tip: If it is difficult to hold on to the bar with this grip, alternate your grip or use wrist straps.","While holding the bar, start the lift by pushing with your legs while simultaneously getting your torso to the upright position as you breathe out. In the upright position, stick your chest out and contract the back by bringing the shoulder blades back. Think of how the soldiers in the military look when they are in standing in attention.","Go back to the starting position by bending at the knees while simultaneously leaning the torso forward at the waist while keeping the back straight. When the weights on the bar touch the floor you are back at the starting position and ready to perform another repetition.","Perform the amount of repetitions prescribed in the program."],"muscles":["lower back","calves","forearms"]},"Sumo Deadlift (Barbell)":{"id":"Sumo_Deadlift","steps":["Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.","Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.","As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.","Return the weight to the ground by bending at the hips and controlling the weight on the way down."],"muscles":["hamstrings","adductors","forearms"]},"Bent Over Row (Barbell)":{"id":"Bent_Over_Barbell_Row","steps":["Holding a barbell with a pronated grip (palms facing down), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","Now, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.","Then inhale and slowly lower the barbell back to the starting position.","Repeat for the recommended amount of repetitions."],"muscles":["middle back","biceps","lats"]},"Pendlay Row (Barbell)":{"id":"Bent_Over_Barbell_Row","steps":["Holding a barbell with a pronated grip (palms facing down), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","Now, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.","Then inhale and slowly lower the barbell back to the starting position.","Repeat for the recommended amount of repetitions."],"muscles":["middle back","biceps","lats"]},"Bent Over Row (Dumbbell)":{"id":"Bent_Over_Two-Dumbbell_Row","steps":["With a dumbbell in each hand (palms facing your torso), bend your knees slightly and bring your torso forward by bending at the waist; as you bend make sure to keep your back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the dumbbells to your side (as you breathe out), keeping the elbows close to the body (do not exert any force with the forearm other than holding the weights). On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"muscles":["middle back","biceps","lats"]},"Single Arm Row (Dumbbell)":{"id":"One-Arm_Dumbbell_Row","steps":["Choose a flat bench and place a dumbbell on each side of it.","Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.","Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.","Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.","Lower the resistance straight down to the starting position. Breathe in as you perform this step.","Repeat the movement for the specified amount of repetitions."],"muscles":["middle back","biceps","lats"]},"Seated Row (Cable)":{"id":"Seated_Cable_Rows","steps":["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.","Repeat for the recommended amount of repetitions."],"muscles":["middle back","biceps","lats"]},"Seated Row (Machine)":{"id":"Leverage_High_Row","steps":["Load an appropriate weight onto the pins and adjust the seat height so that you can just reach the handles above you. Adjust the knee pad to help keep you down. Grasp the handles with a pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position.","For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."],"muscles":["middle back","lats"]},"T Bar Row":{"id":"T-Bar_Row_with_Handle","steps":["Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end.","Stand over the bar, and position a Double D row handle around the bar next to the collar. Using your hips and legs, rise to a standing position.","Assume a wide stance with your hips back and your chest up. Your arms should be extended. This will be your starting position.","Pull the weight to your upper abdomen by retracting the shoulder blades and flexing the elbows. Do not jerk the weight or cheat during the movement.","After a brief pause, return to the starting position."],"muscles":["middle back","biceps","lats"]},"Chest Supported Row":{"id":"Lying_T-Bar_Row","steps":["Load up the T-bar Row Machine with the desired weight and adjust the leg height so that your upper chest is at the top of the pad. Tip: In some machines all you can do is stand on the appropriate step that allows you to be at a height that has the upper chest at the top of the pad.","Lay face down on the pad and grab the handles. You can either use a palms down, palms up, or palms in position depending on what part of your back you want to emphasize.","Lift the bar off the rack and extend your arms in front of you. This will be your starting position.","As you exhale slowly pull the weight up and squeeze your back at the top of the movement. Tip: Keep the upper arms as close to the torso as possible throughout the movement in order to better engage the back muscles. Also, do not lift your body off of the pad at any time and refrain from using the biceps to lift the weight.","After a second contraction at the top of the movement, as you inhale, slowly go back down to the starting position.","Repeat for the recommended amount of repetitions."],"muscles":["middle back","biceps","lats"]},"Lat Pulldown (Cable)":{"id":"Wide-Grip_Lat_Pulldown","steps":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"muscles":["lats","biceps","middle back"]},"Lat Pulldown (Machine)":{"id":"Wide-Grip_Lat_Pulldown","steps":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"muscles":["lats","biceps","middle back"]},"Pull Up":{"id":"Pullups","steps":["Grab the pull-up bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","Pull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."],"muscles":["lats","biceps","middle back"]},"Chin Up":{"id":"Chin-Up","steps":["Grab the pull-up bar with the palms facing your torso and a grip closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, keep your torso as straight as possible while creating a curvature on your lower back and sticking your chest out. This is your starting position. Tip: Keeping the torso as straight as possible maximizes biceps stimulation while minimizing back involvement.","As you breathe out, pull your torso up until your head is around the level of the pull-up bar. Concentrate on using the biceps muscles in order to perform the movement. Keep the elbows close to your body. Tip: The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second of squeezing the biceps in the contracted position, slowly lower your torso back to the starting position; when your arms are fully extended. Breathe in as you perform this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"muscles":["lats","biceps","forearms"]},"Straight Arm Pulldown (Cable)":{"id":"Straight-Arm_Pulldown","steps":["You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.","Bend your torso forward at the waist by around 30-degrees with your arms fully extended in front of you and a slight bend at the elbows. If your arms are not fully extended then you need to step a bit more backwards until they are. Once your arms are fully extended and your torso is slightly bent at the waist, tighten the lats and then you are ready to begin.","While keeping the arms straight, pull the bar down by contracting the lats until your hands are next to the side of the thighs. Breathe out as you perform this step.","While keeping the arms straight, go back to the starting position while breathing in.","Repeat for the recommended amount of repetitions."],"muscles":["lats"]},"Back Extension":{"id":"Hyperextensions_Back_Extensions","steps":["Lie face down on a hyperextension bench, tucking your ankles securely under the footpads.","Adjust the upper pad if possible so your upper thighs lie flat across the wide pad, leaving enough room for you to bend at the waist without any restriction.","With your body straight, cross your arms in front of you (my preference) or behind your head. This will be your starting position. Tip: You can also hold a weight plate for extra resistance in front of you under your crossed arms.","Start bending forward slowly at the waist as far as you can while keeping your back flat. Inhale as you perform this movement. Keep moving forward until you feel a nice stretch on the hamstrings and you can no longer keep going without a rounding of the back. Tip: Never round the back as you perform this exercise. Also, some people can go farther than others. The key thing is that you go as far as your body allows you to without rounding the back.","Slowly raise your torso back to the initial position as you inhale. Tip: Avoid the temptation to arch your back past a straight line. Also, do not swing the torso at any time in order to protect the back from injury.","Repeat for the recommended amount of repetitions."],"muscles":["lower back","glutes","hamstrings"]},"Rack Pull":{"id":"Rack_Pulls","steps":["Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Position yourself against the bar in proper deadlifting position. Your feet should be under your hips, your grip shoulder width, back arched, and hips back to engage the hamstrings. Since the weight is typically heavy, you may use a mixed grip, a hook grip, or use straps to aid in holding the weight.","With your head looking forward, extend through the hips and knees, pulling the weight up and back until lockout. Be sure to pull your shoulders back as you complete the movement.","Return the weight to the pins and repeat."],"muscles":["lower back","forearms","glutes"]},"Overhead Press (Barbell)":{"id":"Standing_Military_Press","steps":["Start by placing a barbell that is about chest high on a squat rack. Once you have selected the weights, grab the barbell using a pronated (palms facing forward) grip. Make sure to grip the bar wider than shoulder width apart from each other.","Slightly bend the knees and place the barbell on your collar bone. Lift the barbell up keeping it lying on your chest. Take a step back and position your feet shoulder width apart from each other.","Once you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the collarbone slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."],"muscles":["shoulders","triceps"]},"Seated Overhead Press (Barbell)":{"id":"Seated_Barbell_Military_Press","steps":["Sit on a Military Press Bench with a bar behind your head and either have a spotter give you the bar (better on the rotator cuff this way) or pick it up yourself carefully with a pronated grip (palms facing forward). Tip: Your grip should be wider than shoulder width and it should create a 90-degree angle between the forearm and the upper arm as the barbell goes down.","Once you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the collarbone slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."],"muscles":["shoulders","triceps"]},"Overhead Press (Dumbbell)":{"id":"Dumbbell_Shoulder_Press","steps":["While holding a dumbbell in each hand, sit on a military press bench or utility bench that has back support. Place the dumbbells upright on top of your thighs.","Now raise the dumbbells to shoulder height one at a time using your thighs to help propel them up into position.","Make sure to rotate your wrists so that the palms of your hands are facing forward. This is your starting position.","Now, exhale and push the dumbbells upward until they touch at the top.","Then, after a brief pause at the top contracted position, slowly lower the weights back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."],"muscles":["shoulders","triceps"]},"Arnold Press (Dumbbell)":{"id":"Arnold_Dumbbell_Press","steps":["Sit on an exercise bench with back support and hold two dumbbells in front of you at about upper chest level with your palms facing your body and your elbows bent. Tip: Your arms should be next to your torso. The starting position should look like the contracted portion of a dumbbell curl.","Now to perform the movement, raise the dumbbells as you rotate the palms of your hands until they are facing forward.","Continue lifting the dumbbells until your arms are extended above you in straight arm position. Breathe out as you perform this portion of the movement.","After a second pause at the top, begin to lower the dumbbells to the original position by rotating the palms of your hands towards you. Tip: The left arm will be rotated in a counter clockwise manner while the right one will be rotated clockwise. Breathe in as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"muscles":["shoulders","triceps"]},"Shoulder Press (Machine)":{"id":"Leverage_Shoulder_Press","steps":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the shoulders at the beginning of the motion. Your chest and head should be up and handles held with a pronated grip. This will be your starting position.","Press the handles upward by extending through the elbow.","After a brief pause at the top, return the weight to just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"muscles":["shoulders","triceps"]},"Push Press":{"id":"Push_Press","steps":[],"muscles":["shoulders","quadriceps","triceps"]},"Lateral Raise (Dumbbell)":{"id":"Side_Lateral_Raise","steps":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.","While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"muscles":["shoulders"]},"Lateral Raise (Cable)":{"id":"Cable_Seated_Lateral_Raise","steps":["Stand in the middle of two low pulleys that are opposite to each other and place a flat bench right behind you (in perpendicular fashion to you; the narrow edge of the bench should be the one behind you). Select the weight to be used on each pulley.","Now sit at the edge of the flat bench behind you with your feet placed in front of your knees.","Bend forward while keeping your back flat and rest your torso on the thighs.","Have someone give you the single handles attached to the pulleys. Grasp the left pulley with the right hand and the right pulley with the left after you select your weight. The pulleys should run under your knees and your arms will be extended with palms facing each other and a slight bend at the elbows. This will be the starting position.","While keeping the arms stationary, raise the upper arms to the sides until they are parallel to the floor and at shoulder height. Exhale during the execution of this movement and hold the contraction for a second.","Slowly lower your arms to the starting position as you inhale."],"muscles":["shoulders","middle back","traps"]},"Front Raise (Dumbbell)":{"id":"Front_Dumbbell_Raise","steps":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells on front of your thighs at arms length with the palms of the hand facing your thighs. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the left dumbbell to the front with a slight bend on the elbow and the palms of the hands always facing down. Continue to go up until you arm is slightly above parallel to the floor. Exhale as you execute this portion of the movement and pause for a second at the top. Inhale after the second pause.","Now lower the dumbbell back down slowly to the starting position as you simultaneously lift the right dumbbell.","Continue alternating in this fashion until all of the recommended amount of repetitions have been performed for each arm."],"muscles":["shoulders"]},"Rear Delt Fly (Dumbbell)":{"id":"Reverse_Flyes","steps":["To begin, lie down on an incline bench with the chest and stomach pressing against the incline. Have the dumbbells in each hand with the palms facing each other (neutral grip).","Extend the arms in front of you so that they are perpendicular to the angle of the bench. The legs should be stationary while applying pressure with the ball of your toes. This is the starting position.","Maintaining the slight bend of the elbows, move the weights out and away from each other (to the side) in an arc motion while exhaling. Tip: Try to squeeze your shoulder blades together to get the best results from this exercise.","The arms should be elevated until they are parallel to the floor.","Feel the contraction and slowly lower the weights back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."],"muscles":["shoulders"]},"Reverse Fly (Machine)":{"id":"Reverse_Machine_Flyes","steps":["Adjust the handles so that they are fully to the rear. Make an appropriate weight selection and adjust the seat height so the handles are at shoulder level. Grasp the handles with your hands facing inwards. This will be your starting position.","In a semicircular motion, pull your hands out to your side and back, contracting your rear delts.","Keep your arms slightly bent throughout the movement, with all of the motion occurring at the shoulder joint.","Pause at the rear of the movement, and slowly return the weight to the starting position."],"muscles":["shoulders"]},"Face Pull (Cable)":{"id":"Face_Pull","steps":["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."],"muscles":["shoulders","middle back"]},"Upright Row (Barbell)":{"id":"Upright_Barbell_Row","steps":["Grasp a barbell with an overhand grip that is slightly less than shoulder width. The bar should be resting on the top of your thighs with your arms extended and a slight bend in your elbows. Your back should also be straight. This will be your starting position.","Now exhale and use the sides of your shoulders to lift the bar, raising your elbows up and to the side. Keep the bar close to your body as you raise it. Continue to lift the bar until it nearly touches your chin. Tip: Your elbows should drive the motion, and should always be higher than your forearms. Remember to keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"muscles":["shoulders","traps"]},"Shrug (Barbell)":{"id":"Barbell_Shrug","steps":["Stand up straight with your feet at shoulder width as you hold a barbell with both hands in front of you using a pronated grip (palms facing the thighs). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for a better grip. This will be your starting position.","Raise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"muscles":["traps"]},"Shrug (Dumbbell)":{"id":"Dumbbell_Shrug","steps":["Stand erect with a dumbbell on each hand (palms facing your torso), arms extended on the sides.","Lift the dumbbells by elevating the shoulders as high as possible while you exhale. Hold the contraction at the top for a second. Tip: The arms should remain extended at all times. Refrain from using the biceps to help lift the dumbbells. Only the shoulders should be moving up and down.","Lower the dumbbells back to the original position.","Repeat for the recommended amount of repetitions."],"muscles":["traps"]},"Bicep Curl (Barbell)":{"id":"Barbell_Curl","steps":["Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"muscles":["biceps","forearms"]},"EZ Bar Curl":{"id":"Close-Grip_EZ_Bar_Curl","steps":["Stand up with your torso upright while holding an E-Z Curl Bar at the closer inner handle. The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar. The elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"muscles":["biceps","forearms"]},"Bicep Curl (Dumbbell)":{"id":"Dumbbell_Bicep_Curl","steps":["Stand up straight with a dumbbell in each hand at arm's length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.","Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps. Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a brief pause as you squeeze your biceps.","Then, inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."],"muscles":["biceps","forearms"]},"Hammer Curl (Dumbbell)":{"id":"Alternate_Hammer_Curl","steps":["Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.","The palms of the hands should be facing your torso. This will be your starting position.","While holding the upper arm stationary, curl the right weight forward while contracting the biceps as you breathe out. Continue the movement until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat the movement with the left hand. This equals one repetition.","Continue alternating in this manner for the recommended amount of repetitions."],"muscles":["biceps","forearms"]},"Incline Curl (Dumbbell)":{"id":"Incline_Dumbbell_Curl","steps":["Sit back on an incline bench with a dumbbell in each hand held at arms length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.","While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"muscles":["biceps"]},"Preacher Curl (Barbell)":{"id":"Preacher_Curl","steps":["To perform this movement you will need a preacher bench and an E-Z bar. Grab the E-Z curl bar at the close inner handle (either have someone hand you the bar which is preferable or grab the bar from the front bar rest provided by most preacher benches). The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar.","With the upper arms positioned against the preacher bench pad and the chest against it, hold the E-Z Curl Bar at shoulder length. This will be your starting position.","As you breathe in, slowly lower the bar until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the bar is at shoulder height. Squeeze the biceps hard and hold this position for a second.","Repeat for the recommended amount of repetitions."],"muscles":["biceps"]},"Preacher Curl (Machine)":{"id":"Machine_Preacher_Curls","steps":["Sit down on the Preacher Curl Machine and select the weight.","Place the back of your upper arms (your triceps) on the preacher pad provided and grab the handles using an underhand grip (palms facing up). Tip: Make sure that when you place the arms on the pad you keep the elbows in. This will be your starting position.","Now lift the handles as you exhale and you contract the biceps. At the top of the position make sure that you hold the contraction for a second. Tip: Only the forearms should move. The upper arms should remain stationary and on the pad at all times.","Lower the handles slowly back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"muscles":["biceps"]},"Bicep Curl (Cable)":{"id":"Standing_Biceps_Cable_Curl","steps":["Stand up with your torso upright while holding a cable curl bar that is attached to a low pulley. Grab the cable bar at shoulder width and keep the elbows close to the torso. The palm of your hands should be facing up (supinated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the curl bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"muscles":["biceps"]},"Concentration Curl":{"id":"Standing_Concentration_Curl","steps":["Taking a dumbbell in your working hand, lean forward. Allow your working arm to hang perpendicular to the ground with the elbow pointing out. This will be your starting position.","Flex the elbow to curl the weight, keeping the upper arm stationary. At the top of the repetition, flex the biceps and pause.","Lower the dumbbell back to the starting position.","Repeat the movement for the prescribed amount of repetitions."],"muscles":["biceps","forearms"]},"Triceps Pushdown (Cable)":{"id":"Triceps_Pushdown","steps":["Attach a straight or angled bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."],"muscles":["triceps"]},"Overhead Triceps Extension (Cable)":{"id":"Cable_Rope_Overhead_Triceps_Extension","steps":["Attach a rope to the bottom pulley of the pulley machine.","Grasping the rope with both hands, extend your arms with your hands directly above your head using a neutral grip (palms facing each other). Your elbows should be in close to your head and the arms should be perpendicular to the floor with the knuckles aimed at the ceiling. This will be your starting position.","Slowly lower the rope behind your head as you hold the upper arms stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.","Return to the starting position by flexing your triceps as you breathe out.","Repeat for the recommended amount of repetitions."],"muscles":["triceps"]},"Triceps Extension (Dumbbell)":{"id":"Standing_Dumbbell_Triceps_Extension","steps":["To begin, stand up with a dumbbell held by both hands. Your feet should be about shoulder width apart from each other. Slowly use both hands to grab the dumbbell and lift it over your head until both arms are fully extended.","The resistance should be resting in the palms of your hands with your thumbs around it. The palm of the hands should be facing up towards the ceiling. This will be your starting position.","Keeping your upper arms close to your head with elbows in and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions."],"muscles":["triceps"]},"Skullcrusher (Barbell)":{"id":"EZ-Bar_Skullcrusher","steps":["Using a close grip, lift the EZ bar and hold it with your elbows in as you lie on the bench. Your arms should be perpendicular to the floor. This will be your starting position.","Keeping the upper arms stationary, lower the bar by allowing the elbows to flex. Inhale as you perform this portion of the movement. Pause once the bar is directly above the forehead.","Lift the bar back to the starting position by extending the elbow and exhaling.","Repeat."],"muscles":["triceps","forearms"]},"Close Grip Bench Press (Barbell)":{"id":"Close-Grip_Barbell_Bench_Press","steps":["Lie back on a flat bench. Using a close grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that - as opposed to a regular bench press - you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"muscles":["triceps","chest","shoulders"]},"Triceps Dip":{"id":"Dips_-_Triceps_Version","steps":["To get into the starting position, hold your body at arm's length with your arms nearly locked above the bars.","Now, inhale and slowly lower yourself downward. Your torso should remain upright and your elbows should stay close to your body. This helps to better focus on tricep involvement. Lower yourself until there is a 90 degree angle formed between the upper arm and forearm.","Then, exhale and push your torso back up using your triceps to bring your body back to the starting position.","Repeat the movement for the prescribed amount of repetitions."],"muscles":["triceps","chest","shoulders"]},"Triceps Kickback (Dumbbell)":{"id":"Tricep_Dumbbell_Kickback","steps":["Start with a dumbbell in each hand and your palms facing your torso. Keep your back straight with a slight bend in the knees and bend forward at the waist. Your torso should be almost parallel to the floor. Make sure to keep your head up. Your upper arms should be close to your torso and parallel to the floor. Your forearms should be pointed towards the floor as you hold the weights. There should be a 90-degree angle formed between your forearm and upper arm. This is your starting position.","Now, while keeping your upper arms stationary, exhale and use your triceps to lift the weights until the arm is fully extended. Focus on moving the forearm.","After a brief pause at the top contraction, inhale and slowly lower the dumbbells back down to the starting position.","Repeat the movement for the prescribed amount of repetitions."],"muscles":["triceps"]},"JM Press":{"id":"JM_Press","steps":["Start the exercise the same way you would a close grip bench press. You will lie on a flat bench while holding a barbell at arms length (fully extended) with the elbows in. However, instead of having the arms perpendicular to the torso, make sure the bar is set in a direct line above the upper chest. This will be your starting position.","Now beginning from a fully extended position lower the bar down as if performing a lying triceps extension. Inhale as you perform this movement. When you reach the half way point, let the bar roll back about one inch by moving the upper arms towards your legs until they are perpendicular to the torso. Tip: Keep the bend at the elbows constant as you bring the upper arms forward.","As you exhale, press the bar back up by using the triceps to perform a close grip bench press.","Now go back to the starting position and start over.","Repeat for the recommended amount of repetitions."],"muscles":["triceps","chest","shoulders"]},"Wrist Curl (Barbell)":{"id":"Palms-Up_Barbell_Wrist_Curl_Over_A_Bench","steps":["Start out by placing a barbell on one side of a flat bench.","Kneel down on both of your knees so that your body is facing the flat bench.","Use your arms to grab the barbell with a supinated grip (palms up) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.","Start out by curling your wrist upwards and exhaling.","Slowly lower your wrists back down to the starting position while inhaling.","Your forearms should be stationary as your wrist is the only movement needed to perform this exercise."],"muscles":["forearms"]},"Reverse Curl (Barbell)":{"id":"Reverse_Barbell_Curl","steps":["Stand up with your torso upright while holding a barbell at shoulder width with the elbows close to the torso. The palm of your hands should be facing down (pronated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"muscles":["biceps","forearms"]},"Farmers Walk":{"id":"Farmers_Walk","steps":["There are various implements that can be used for the farmers walk. These can also be performed with heavy dumbbells or short bars if these implements aren't available. Begin by standing between the implem
