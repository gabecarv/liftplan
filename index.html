ents.","After gripping the handles, lift them up by driving through your heels, keeping your back straight and your head up.","Walk taking short, quick steps, and don't forget to breathe. Move for a given distance, typically 50-100 feet, as fast as possible."],"muscles":["forearms","abdominals","glutes"]},"Dead Hang":{"id":"One_Handed_Hang","steps":["Grab onto a chinup bar with one hand, using a pronated grip. Keep your feet on the floor or a step. Allow the majority of your weight to hang from that hand, while keeping your feet on the ground. Hold for 10-20 seconds and switch sides."],"muscles":["lats","biceps"]},"Squat (Barbell)":{"id":"Barbell_Squat","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack to just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees and hips as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"muscles":["quadriceps","calves","glutes"]},"Front Squat (Barbell)":{"id":"Front_Barbell_Squat","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, bring your arms up under the bar while keeping the elbows high and the upper arm slightly above parallel to the floor. Rest the bar on top of the deltoids and cross your arms while grasping the bar for total control.","Lift the bar off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor mainly with the middle of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"muscles":["quadriceps","calves","glutes"]},"Box Squat (Barbell)":{"id":"Box_Squat","steps":["The box squat allows you to squat to desired depth and develop explosive strength in the squat movement. Begin in a power rack with a box at the appropriate height behind you. Typically, you would aim for a box height that brings you to a parallel squat, but you can train higher or lower if desired.","Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wider for more emphasis on the back, glutes, adductors, and hamstrings, or closer together for more quad development. Keep your head facing forward.","With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. Ideally, your shins should be perpendicular to the ground. Pause when you reach the box, and relax the hip flexors. Never bounce off of a box.","Keeping the weight on your heels and pushing your feet and knees out, drive upward off of the box as you lead the movement with your head. Continue upward, maintaining tightness head to toe."],"muscles":["quadriceps","adductors","calves"]},"Goblet Squat (Dumbbell)":{"id":"Goblet_Squat","steps":["Stand holding a light kettlebell by the horns close to your chest. This will be your starting position.","Squat down between your legs until your hamstrings are on your calves. Keep your chest and head up and your back straight.","At the bottom position, pause and use your elbows to push your knees out. Return to the starting position, and repeat for 10-20 repetitions."],"muscles":["quadriceps","calves","glutes"]},"Hack Squat":{"id":"Hack_Squat","steps":["Place the back of your torso against the back pad of the machine and hook your shoulders under the shoulder pads provided.","Position your legs in the platform using a shoulder width medium stance with the toes slightly pointed out. Tip: Keep your head up at all times and also maintain the back on the pad at all times.","Place your arms on the side handles of the machine and disengage the safety bars (which on most designs is done by moving the side handles from a facing front position to a diagonal position).","Now straighten your legs without locking the knees. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Begin to slowly lower the unit by bending the knees as you maintain a straight posture with the head up (back on the pad at all times). Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the unit as you exhale by pushing the floor with mainly with the heel of your foot as you straighten the legs again and go back to the starting position."],"muscles":["quadriceps","calves","glutes"]},"Leg Press":{"id":"Leg_Press","steps":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."],"muscles":["quadriceps","calves","glutes"]},"Leg Extension (Machine)":{"id":"Leg_Extensions","steps":["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.","Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.","Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.","Repeat for the recommended amount of times."],"muscles":["quadriceps"]},"Bulgarian Split Squat":{"id":"Split_Squat_with_Dumbbells","steps":["Position yourself into a staggered stance with the rear foot elevated and front foot forward.","Hold a dumbbell in each hand, letting them hang at the sides. This will be your starting position.","Begin by descending, flexing your knee and hip to lower your body down. Maintain good posture througout the movement. Keep the front knee in line with the foot as you perform the exercise.","At the bottom of the movement, drive through the heel to extend the knee and hip to return to the starting position."],"muscles":["quadriceps","glutes","hamstrings"]},"Lunge (Dumbbell)":{"id":"Dumbbell_Lunges","steps":["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step forward with your right leg around 2 feet or so from the foot being left stationary behind and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground.","Using mainly the heel of your foot, push up and go back to the starting position as you exhale.","Repeat the movement for the recommended amount of repetitions and then perform with the left leg."],"muscles":["quadriceps","calves","glutes"]},"Walking Lunge":{"id":"Bodyweight_Walking_Lunge","steps":["Begin standing with your feet shoulder width apart and your hands on your hips.","Step forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.","Drive through the heel of your lead foot and extend both knees to raise yourself back up.","Step forward with your rear foot, repeating the lunge on the opposite leg."],"muscles":["quadriceps","calves","glutes"]},"Step Up":{"id":"Dumbbell_Step_Ups","steps":["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.","Step down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position.","Repeat with the right leg for the recommended amount of repetitions and then perform with the left leg."],"muscles":["quadriceps","calves","glutes"]},"Sissy Squat":{"id":"Weighted_Sissy_Squat","steps":["Standing upright, with feet at shoulder width and toes raised, use one hand to hold onto the beams of a squat rack and the opposite arm to hold a plate on top of your chest. This is your starting position.","As you use one arm to hold yourself, bend at the knees and slowly lower your torso toward the ground by bringing your pelvis and knees forward. Inhale as you go down and stop when your upper and lower legs almost create a 90-degree angle. Hold the stretch position for a second.","After your one second hold, use your thigh muscles to bring your torso back up to the starting position. Exhale as you move up.","Repeat for the recommended amount of times."],"muscles":["quadriceps","calves","glutes"]},"Romanian Deadlift (Barbell)":{"id":"Romanian_Deadlift","steps":["Put a barbell in front of you on the ground and grab it using a pronated (palms facing down) grip that a little wider than shoulder width. Tip: Depending on the weight used, you may need wrist wraps to perform the exercise and also a raised platform in order to allow for better range of motion.","Bend the knees slightly and keep the shins vertical, hips back and back straight. This will be your starting position.","Keeping your back and arms completely straight at all times, use your hips to lift the bar as you exhale. Tip: The movement should not be fast but steady and under control.","Once you are standing completely straight up, lower the bar by pushing the hips back, only slightly bending the knees, unlike when squatting. Tip: Take a deep breath at the start of the movement and keep your chest up. Hold your breath as you lower and exhale as you complete the movement.","Repeat for the recommended amount of repetitions."],"muscles":["hamstrings","calves","glutes"]},"Romanian Deadlift (Dumbbell)":{"id":"Stiff-Legged_Dumbbell_Deadlift","steps":["Grasp a couple of dumbbells holding them by your side at arm's length.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the dumbbells to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement","Start bringing your torso up straight again by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.","Repeat for the recommended amount of repetitions."],"muscles":["hamstrings","glutes","lower back"]},"Stiff Leg Deadlift (Barbell)":{"id":"Stiff-Legged_Barbell_Deadlift","steps":["Grasp a bar using an overhand grip (palms facing down). You may need some wrist wraps if using a significant amount of weight.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the barbell to over the top of your feet by bending at the hips while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Inhale as you perform this movement.","Start bringing your torso up straight again by extending your hips until you are back at the starting position. Exhale as you perform this movement.","Repeat for the recommended amount of repetitions."],"muscles":["hamstrings","glutes","lower back"]},"Leg Curl (Machine)":{"id":"Lying_Leg_Curls","steps":["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.","Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.","As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."],"muscles":["hamstrings"]},"Seated Leg Curl (Machine)":{"id":"Seated_Leg_Curl","steps":["Adjust the machine lever to fit your height and sit on the machine with your back against the back support pad.","Place the back of lower leg on top of padded lever (just a few inches under the calves) and secure the lap pad against your thighs, just above the knees. Then grasp the side handles on the machine as you point your toes straight (or you can also use any of the other two stances) and ensure that the legs are fully straight right in front of you. This will be your starting position.","As you exhale, pull the machine lever as far as possible to the back of your thighs by flexing at the knees. Keep your torso stationary at all times. Hold the contracted position for a second.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"muscles":["hamstrings"]},"Nordic Curl":{"id":"Floor_Glute-Ham_Raise","steps":["You can use a partner for this exercise or brace your feet under something stable.","Begin on your knees with your upper legs and torso upright. If using a partner, they will firmly hold your feet to keep you in position. This will be your starting position.","Lower yourself by extending at the knee, taking care to NOT flex the hips as you go forward.","Place your hands in front of you as you reach the floor. This movement is very difficult and you may be unable to do it unaided. Use your arms to lightly push off the floor to aid your return to the starting position."],"muscles":["hamstrings","calves","glutes"]},"Good Morning (Barbell)":{"id":"Good_Morning","steps":["Begin with a bar on a rack at shoulder height. Rack the bar across the rear of your shoulders as you would a power squat, not on top of your shoulders. Keep your back tight, shoulder blades pinched together, and your knees slightly bent. Step back from the rack.","Begin by bending at the hips, moving them back as you bend over to near parallel. Keep your back arched and your cervical spine in proper alignment.","Reverse the motion by extending through the hips with your glutes and hamstrings. Continue until you have returned to the starting position."],"muscles":["hamstrings","abdominals","glutes"]},"Hip Thrust (Barbell)":{"id":"Barbell_Hip_Thrust","steps":["Begin seated on the ground with a bench directly behind you. Have a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise.","Roll the bar so that it is directly above your hips, and lean back against the bench so that your shoulder blades are near the top of it.","Begin the movement by driving through your feet, extending your hips vertically through the bar. Your weight should be supported by your shoulder blades and your feet. Extend as far as possible, then reverse the motion to return to the starting position."],"muscles":["glutes","calves","hamstrings"]},"Hip Thrust (Machine)":{"id":"Barbell_Hip_Thrust","steps":["Begin seated on the ground with a bench directly behind you. Have a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise.","Roll the bar so that it is directly above your hips, and lean back against the bench so that your shoulder blades are near the top of it.","Begin the movement by driving through your feet, extending your hips vertically through the bar. Your weight should be supported by your shoulder blades and your feet. Extend as far as possible, then reverse the motion to return to the starting position."],"muscles":["glutes","calves","hamstrings"]},"Glute Bridge":{"id":"Butt_Lift_Bridge","steps":["Lie flat on the floor on your back with the hands by your side and your knees bent. Your feet should be placed around shoulder width. This will be your starting position.","Pushing mainly with your heels, lift your hips off the floor while keeping your back straight. Breathe out as you perform this part of the motion and hold at the top for a second.","Slowly go back to the starting position as you breathe in."],"muscles":["glutes","hamstrings"]},"Glute Kickback (Cable)":{"id":"One-Legged_Cable_Kickback","steps":["Hook a leather ankle cuff to a low cable pulley and then attach the cuff to your ankle.","Face the weight stack from a distance of about two feet, grasping the steel frame for support.","While keeping your knees and hips bent slightly and your abs tight, contract your glutes to slowly \"kick\" the working leg back in a semicircular arc as high as it will comfortably go as you breathe out. Tip: At full extension, squeeze your glutes for a second in order to achieve a peak contraction.","Now slowly bring your working leg forward, resisting the pull of the cable until you reach the starting position.","Repeat for the recommended amount of repetitions.","Switch legs and repeat the movement for the other side."],"muscles":["glutes","hamstrings"]},"Hip Abduction (Machine)":{"id":"Thigh_Abductor","steps":["To begin, sit down on the abductor machine and select a weight you are comfortable with. When your legs are positioned properly, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them away from each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary to prevent any injuries from occurring.","Repeat for the recommended amount of repetitions."],"muscles":["abductors","glutes"]},"Hip Adduction (Machine)":{"id":"Thigh_Adductor","steps":["To begin, sit down on the adductor machine and select a weight you are comfortable with. When your legs are positioned properly on the leg pads of the machine, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them towards each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary and avoid fast jerking motions in order to prevent any injuries from occurring.","Repeat for the recommended amount of repetitions."],"muscles":["adductors","glutes","hamstrings"]},"Cable Pull Through":{"id":"Pull_Through","steps":["Begin standing a few feet in front of a low pulley with a rope or handle attached. Face away from the machine, straddling the cable, with your feet set wide apart.","Begin the movement by reaching through your legs as far as possible, bending at the hips. Keep your knees slightly bent. Keeping your arms straight, extend through the hip to stand straight up. Avoid pulling upward through the shoulders; all of the motion should originate through the hips."],"muscles":["glutes","hamstrings","lower back"]},"Standing Calf Raise":{"id":"Standing_Calf_Raises","steps":["Adjust the padded lever of the calf raise machine to fit your height.","Place your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."],"muscles":["calves"]},"Seated Calf Raise":{"id":"Seated_Calf_Raise","steps":["Sit on the machine and place your toes on the lower portion of the platform provided with the heels extending off. Choose the toe positioning of your choice (forward, in, or out) as per the beginning of this chapter.","Place your lower thighs under the lever pad, which will need to be adjusted according to the height of your thighs. Now place your hands on top of the lever pad in order to prevent it from slipping forward.","Lift the lever slightly by pushing your heels up and release the safety bar. This will be your starting position.","Slowly lower your heels by bending at the ankles until the calves are fully stretched. Inhale as you perform this movement.","Raise the heels by extending the ankles as high as possible as you contract the calves and breathe out. Hold the top contraction for a second.","Repeat for the recommended amount of repetitions."],"muscles":["calves"]},"Calf Press (Machine)":{"id":"Calf_Press","steps":["Adjust the seat so that your legs are only slightly bent in the start position. The balls of your feet should be firmly on the platform.","Select an appropriate weight, and grasp the handles. This will be your starting position.","Straighten the legs by extending the knees, just barely lifting the weight from the stack. Your ankle should be fully flexed, toes pointing up. Execute the movement by pressing downward through the balls of your feet as far as possible.","After a brief pause, reverse the motion and repeat."],"muscles":["calves"]},"Single Leg Calf Raise":{"id":"Standing_Dumbbell_Calf_Raise","steps":["Stand with your torso upright holding two dumbbells in your hands by your sides. Place the ball of the foot on a sturdy and stable wooden board (that is around 2-3 inches tall) while your heels extend off and touch the floor. This will be your starting position.","With the toes pointing either straight (to hit all parts equally), inwards (for emphasis on the outer head) or outwards (for emphasis on the inner head), raise the heels off the floor as you exhale by contracting the calves. Hold the top contraction for a second.","As you inhale, go back to the starting position by slowly lowering the heels.","Repeat for the recommended amount of times."],"muscles":["calves"]},"Plank":{"id":"Plank","steps":["Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.","Keep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised."],"muscles":["abdominals"]},"Side Plank":{"id":"Side_Bridge","steps":[],"muscles":["abdominals","shoulders"]},"Hanging Leg Raise":{"id":"Hanging_Leg_Raise","steps":["Hang from a chin-up bar with both arms extended at arms length in top of you using either a wide grip or a medium grip. The legs should be straight down with the pelvis rolled slightly backwards. This will be your starting position.","Raise your legs until the torso makes a 90-degree angle with the legs. Exhale as you perform this movement and hold the contraction for a second or so.","Go back slowly to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"muscles":["abdominals"]},"Hanging Knee Raise":{"id":"Hanging_Leg_Raise","steps":["Hang from a chin-up bar with both arms extended at arms length in top of you using either a wide grip or a medium grip. The legs should be straight down with the pelvis rolled slightly backwards. This will be your starting position.","Raise your legs until the torso makes a 90-degree angle with the legs. Exhale as you perform this movement and hold the contraction for a second or so.","Go back slowly to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"muscles":["abdominals"]},"Cable Crunch":{"id":"Cable_Crunch","steps":["Kneel below a high pulley that contains a rope attachment.","Grasp cable rope attachment and lower the rope until your hands are placed next to your face.","Flex your hips slightly and allow the weight to hyperextend the lower back. This will be your starting position.","With the hips stationary, flex the waist as you contract the abs so that the elbows travel towards the middle of the thighs. Exhale as you perform this portion of the movement and hold the contraction for a second.","Slowly return to the starting position as you inhale. Tip: Make sure that you keep constant tension on the abs throughout the movement. Also, do not choose a weight so heavy that the lower back handles the brunt of the work.","Repeat for the recommended amount of repetitions."],"muscles":["abdominals"]},"Ab Wheel":{"id":"Ab_Roller","steps":["Hold the Ab Roller with both hands and kneel on the floor.","Now place the ab roller on the floor in front of you so that you are on all your hands and knees (as in a kneeling push up position). This will be your starting position.","Slowly roll the ab roller straight forward, stretching your body into a straight position. Tip: Go down as far as you can without touching the floor with your body. Breathe in during this portion of the movement.","After a pause at the stretched position, start pulling yourself back to the starting position as you breathe out. Tip: Go slowly and keep your abs tight at all times."],"muscles":["abdominals","shoulders"]},"Crunch":{"id":"Crunches","steps":["Lie flat on your back with your feet flat on the ground, or resting on a bench with your knees bent at a 90 degree angle. If you are resting your feet on a bench, place them three to four inches apart and point your toes inward so they touch.","Now place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.","While pushing the small of your back down in the floor to better isolate your abdominal muscles, begin to roll your shoulders off the floor.","Continue to push down as hard as you can with your lower back as you contract your abdominals and exhale. Your shoulders should come up off the floor only about four inches, and your lower back should remain on the floor. At the top of the movement, contract your abdominals hard and keep the contraction for a second. Tip: Focus on slow, controlled movement - don't cheat yourself by using momentum.","After the one second contraction, begin to come down slowly again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"muscles":["abdominals"]},"Sit Up":{"id":"Sit-Up","steps":["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.","Place your hands behind your head and lock them together by clasping your fingers. This is the starting position.","Elevate your upper body so that it creates an imaginary V-shape with your thighs. Breathe out when performing this part of the exercise.","Once you feel the contraction for a second, lower your upper body back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."],"muscles":["abdominals"]},"Russian Twist":{"id":"Russian_Twist","steps":["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.","Elevate your upper body so that it creates an imaginary V-shape with your thighs. Your arms should be fully extended in front of you perpendicular to your torso and with the hands clasped. This is the starting position.","Twist your torso to the right side until your arms are parallel with the floor while breathing out.","Hold the contraction for a second and move back to the starting position while breathing out. Now move to the opposite side performing the same techniques you applied to the right side.","Repeat for the recommended amount of repetitions."],"muscles":["abdominals","lower back"]},"Dead Bug":{"id":"Dead_Bug","steps":["Begin lying on your back with your hands extended above you toward the ceiling.","Bring your feet, knees, and hips up to 90 degrees.","Exhale hard to bring your ribcage down and flatten your back onto the floor, rotating your pelvis up and squeezing your glutes. Hold this position throughout the movement. This will be your starting position.","Initiate the exercise by extending one leg, straightening the knee and hip to bring the leg just above the ground.","Maintain the position of your lumbar and pelvis as you perform the movement, as your back is going to want to arch.","Stay tight and return the working leg to the starting position."],"muscles":["abdominals"]},"Pallof Press":{"id":"Pallof_Press","steps":["Connect a standard handle to a tower, and\u2014if possible\u2014position the cable to shoulder height. If not, a low pulley will suffice.","With your side to the cable, grab the handle with both hands and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.","With your feet positioned hip-width apart and knees slightly bent, hold the cable to the middle of your chest. This will be your starting position.","Press the cable away from your chest, fully extending both arms. You core should be tight and engaged.","Hold the repetition for several seconds before returning to the starting position.","At the conclusion of the set, repeat facing the other direction."],"muscles":["abdominals","chest","shoulders"]},"Clean (Barbell)":{"id":"Clean","steps":["With a barbell on the floor close to the shins, take an overhand (or hook) grip just outside the legs. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.","","Begin the first pull by driving through the heels, extending your knees. Your back angle should stay the same, and your arms should remain straight. Move the weight with control as you continue to above the knees.","Next comes the second pull, the main source of acceleration for the clean. As the bar approaches the mid-thigh position, begin extending through the hips. In a jumping motion, accelerate by extending the hips, knees, and ankles, using speed to move the bar upward. There should be no need to actively pull through the arms to accelerate the weight; at the end of the second pull, the body should be fully extended, leaning slightly back, with the arms still extended.","As full extension is achieved, transition into the third pull by aggressively shrugging and flexing the arms with the elbows up and out. At peak extension, aggressively pull yourself down, rotating your elbows under the bar as you do so. Receive the bar in a front squat position, the depth of which is dependent upon the height of the bar at the end of the third pull. The bar should be racked onto the protracted shoulders, lightly touching the throat with the hands relaxed. Continue to descend to the bottom squat position, which will help in the recovery.","Immediately recover by driving through the heels, keeping the torso upright and elbows up. Continue until you have risen to a standing position."],"muscles":["hamstrings","calves","forearms"]},"Power Clean (Barbell)":{"id":"Power_Clean","steps":["Stand with your feet slightly wider than shoulder width apart and toes pointing out slightly.","Squat down and grasp bar with a closed, pronated grip. Your hands should be slightly wider than shoulder width apart outside knees with elbows fully extended.","Place the bar about 1 inch in front of your shins and over the balls of your feet.","Your back should be flat or slightly arched, your chest held up and out and your shoulder blades should be retracted.","Keep your head in a neutral position (in line with vertebral column and not tilted or rotated) with your eyes focused straight ahead. Inhale during this phase.","Lift the bar from the floor by forcefully extending the hips and the knees as you exhale. Tip: The upper torso should maintain the same angle. Do not bend at the waist yet and do not let the hips rise before the shoulders (this would have the effect of pushing the glutes in the air and stretching the hamstrings."],"muscles":["hamstrings","calves","forearms"]},"Snatch (Barbell)":{"id":"Snatch","steps":["Place your feet at a shoulder width stance with the barbell resting right above the connection between the toes and the rest of the foot.","With a palms facing down grip, bend at the knees and keeping the back flat grab the bar using a wider than shoulder width grip. Bring the hips down and make sure that your body drops as if you were going to sit on a chair. This will be your starting position.","Start pushing the floor as if it were a moving platform with your feet and simultaneously start lifting the barbell keeping it close to your legs.","As the bar reaches the middle of your thighs, push the floor with your legs and lift your body to a complete extension in an explosive motion.","Lift your shoulders back in a shrugging movement as you bring the bar up while lifting your elbows out to the side and keeping them above the bar for as long as possible.","Now in a very quick but powerful motion, you have to get your body under the barbell when it has reached a high enough point where it can be controlled and drop while locking your arms and holding the barbell overhead as you assume a squat position."],"muscles":["quadriceps","biceps","glutes"]},"Thruster (Barbell)":{"id":"Kettlebell_Thruster","steps":["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so. This will be your starting position.","Begin to squat by flexing your hips and knees, lowering your hips between your legs. Maintain an upright, straight back as you descend as low as you can.","At the bottom, reverse direction and squat by extending your knees and hips, driving through your heels. As you do so, press both kettlebells overhead by extending your arms straight up, using the momentum from the squat to help drive the weights upward.","As you begin the next repetition, return the weights to the shoulders."],"muscles":["shoulders","quadriceps","triceps"]},"Kettlebell Swing":{"id":"One-Arm_Kettlebell_Swings","steps":[],"muscles":["hamstrings","calves","glutes"]},"Turkish Get Up":{"id":"Kettlebell_Turkish_Get-Up_Lunge_style","steps":["Lie on your back on the floor and press a kettlebell to the top position by extending the elbow. Bend the knee on the same side as the kettlebell.","Keeping the kettlebell locked out at all times, pivot to the opposite side and use your non- working arm to assist you in driving forward to the lunge position. Using your free hand, push yourself to a seated position, then progressing to one knee.","While looking up at the kettlebell, slowly stand up. Reverse the motion back to the starting position and repeat."],"muscles":["shoulders","abdominals","hamstrings"]},"Sled Push":{"id":"Sled_Push","steps":["Load your pushing sled with the desired weight.","Take an athletic posture, leaning into the sled with your arms fully extended, grasping the handles. Push the sled as fast as possible, focusing on extending your hips and knees to strengthen your posterior chain."],"muscles":["quadriceps","calves","chest"]},"Running":{"id":"Running_Treadmill","steps":["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than running outside. A 150 lb person will burn over 450 calories running 8 miles per hour for 30 minutes. Maintain proper posture as you run, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."],"muscles":["quadriceps","calves","glutes"]},"Cycling":{"id":"Bicycling_Stationary","steps":["To begin, seat yourself on the bike and adjust the seat to your height.","Select the desired option from the menu. You may have to start pedaling to turn it on. You can use the manual setting, or you can select a program to use. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. The level of resistance can be changed throughout the workout. The handles can be used to monitor your heart rate to help you stay at an appropriate intensity."],"muscles":["quadriceps","calves","glutes"]},"Rowing (Machine)":{"id":"Rowing_Stationary","steps":["To begin, seat yourself on the rower. Make sure that your heels are resting comfortably against the base of the foot pedals and that the straps are secured. Select the program that you wish to use, if applicable. Sit up straight and bend forward at the hips.","There are three phases of movement when using a rower. The first phase is when you come forward on the rower. Your knees are bent and against your chest. Your upper body is leaning slightly forward while still maintaining good posture. Next, push against the foot pedals and extend your legs while bringing your hands to your upper abdominal area, squeezing your shoulders back as you do so. To avoid straining your back, use primarily your leg and hip muscles.","The recovery phase simply involves straightening your arms, bending the knees, and bringing your body forward again as you transition back into the first phase."],"muscles":["quadriceps","biceps","calves"]},"Stair Climber":{"id":"Stairmaster","steps":["To begin, step onto the stairmaster and select the desired option from the menu. You can choose a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise.","Pump your legs up and down in an established rhythm, driving the pedals down but not all the way to the floor. It is recommended that you maintain your grip on the handles so that you don't fall. The handles can be used to monitor your heart rate to help you stay at an appropriate intensity.","Stairmasters offer convenience, cardiovascular benefits, and usually have less impact than running outside. They are typically much harder than other cardio equipment. A 150 lb person will typically burn over 300 calories in 30 minutes, compared to about 175 calories walking."],"muscles":["quadriceps","calves","glutes"]},"Elliptical":{"id":"Elliptical_Trainer","steps":["To begin, step onto the elliptical and select the desired option from the menu. Most ellipticals have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","The handles can be used to monitor your heart rate to help you stay at an appropriate intensity."],"muscles":["quadriceps","calves","glutes"]},"Jump Rope":{"id":"Rope_Jumping","steps":["Hold an end of the rope in each hand. Position the rope behind you on the ground. Raise your arms up and turn the rope over your head bringing it down in front of you. When it reaches the ground, jump over it. Find a good turning pace that can be maintained. Different speeds and techniques can be used to introduce variation.","Rope jumping is exciting, challenges your coordination, and requires a lot of energy. A 150 lb person will burn about 350 calories jumping rope for 30 minutes, compared to over 450 calories running."],"muscles":["quadriceps","calves","hamstrings"]},"Assault Bike":{"id":"Air_Bike","steps":["Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put your hands beside your head. Be careful however to not strain with the neck as you perform it. Now lift your shoulders into the crunch position.","Bring knees up to where they are perpendicular to the floor, with your lower legs parallel to the floor. This will be your starting position.","Now simultaneously, slowly go through a cycle pedal motion kicking forward with the right leg and bringing in the knee of the left leg. Bring your right elbow close to your left knee by crunching to the side, as you breathe out.","Go back to the initial position as you breathe in.","Crunch to the opposite side as you cycle your legs and bring closer your left elbow to your right knee and exhale.","Continue alternating in this manner until all of the recommended repetitions for each side have been completed."],"muscles":["abdominals"]}};

// ---------- CSV + plan import ----------
function parseCSV(text){
  text = text.replace(/^\uFEFF/,''); const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','||c==='\t'){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c; }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  const head = rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>{ const o={}; head.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o; });
}
const WDI = {sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
function parsePlan(text, defaultName){
  const rows = parseCSV(text); const get=(r,...ks)=>{ for(const k of ks) if(r[k]) return r[k]; return ''; };
  if(!rows.length || !('day' in rows[0])) throw new Error('Missing required column: day');
  if(!('routine' in rows[0]) && !('workout' in rows[0])) throw new Error('Missing required column: routine');
  const out = rows.map((r,i)=>({ plan:get(r,'plan','block','program'), week:+get(r,'week')||1, day:get(r,'day'), routine:get(r,'routine','workout','session'),
    exercise:get(r,'exercise','movement','lift')||null, sets:+get(r,'sets')||3, reps:get(r,'reps')||'8', weight:parseFloat(get(r,'weight','load','lbs'))||null,
    rpe:parseFloat(get(r,'rpe'))||null, rest:+get(r,'rest','rest_sec')||90, time:get(r,'time','start')||null, duration:+get(r,'duration','minutes')||60, notes:get(r,'notes','note')||'', line:i+2 }));
  const warnings = out.filter(r => WDI[r.day.toLowerCase()]===undefined && !/^\d{4}-\d{2}-\d{2}$/.test(r.day)).map(r=>`Row ${r.line}: unreadable day "${r.day}"`);
  const planName = out[0].plan || defaultName;
  const weeks = Math.max(...out.map(r=>r.week));
  const sessions = new Set(out.map(r=>`${r.week}|${r.day}|${r.routine}`)).size;
  const usesWeekdays = out.some(r=>WDI[r.day.toLowerCase()]!==undefined);
  const routines = [...new Set(out.map(r=>r.routine))];
  const newEx = [...new Set(out.filter(r=>r.exercise&&!findEx(r.exercise)).map(r=>r.exercise))];
  return { rows:out, planName, weeks, sessions, usesWeekdays, routines, newEx, warnings };
}
function commitPlan(imp, opts){
  if(opts.replace) DB.scheduled = DB.scheduled.filter(s=>s.plan!==imp.planName);
  const byName = {}; const sig = {}; const created=[];
  const sessions = new Map();
  for(const r of imp.rows){ const k=`${r.week}|${r.day}|${r.routine}`; if(!sessions.has(k)) sessions.set(k,[]); sessions.get(k).push(r); }
  let pi = Object.keys(DB.routines).length;
  const newRoutine = (name,notes='') => { const r={id:uid(),name,notes,color:PALETTE[pi++%PALETTE.length],exercises:[]}; DB.routines[r.id]=r; return r; };
  const build = (r, rows) => { r.exercises = rows.map((x,i)=>({ ex:findOrCreateEx(x.exercise).id, order:i, sets:x.sets, reps:x.reps, weight:x.weight, rpe:x.rpe, rest:x.rest, notes:x.notes })); };
  for(const [k, rows] of sessions){
    const [week, day, name] = [rows[0].week, rows[0].day, rows[0].routine];
    const exRows = rows.filter(x=>x.exercise);
    const s = exRows.map(x=>`${x.exercise}|${x.sets}|${x.reps}|${x.weight}|${x.rpe}`).join(';');
    let routine;
    if(!exRows.length){ routine = byName[name] || Object.values(DB.routines).find(r=>r.name===name) || newRoutine(name); byName[name]=routine; }
    else if(sig[name]!==undefined && sig[name]!==s){ const vn=`${name} (W${week})`; routine = byName[vn] || (byName[vn]=newRoutine(vn,`Variant of ${name}, week ${week}`)); if(!routine.exercises.length){ build(routine,exRows); routine.color = byName[name]?.color||routine.color; } }
    else if(byName[name]){ routine = byName[name]; if(!routine.exercises.length){ build(routine,exRows); sig[name]=s; } }
    else { routine = Object.values(DB.routines).find(r=>r.name===name) || newRoutine(name); build(routine,exRows); byName[name]=routine; sig[name]=s; }
    const dates=[]; const wdi = WDI[day.toLowerCase()];
    if(wdi===undefined) dates.push(day);
    else { const start = parseDay(opts.startDate); let off = wdi - start.getDay(); if(off<0) off+=7;
      for(let rep=0; rep<Math.max(1,opts.repeat); rep++) dates.push(addDays(opts.startDate, off + (week-1)*7 + rep*imp.weeks*7)); }
    dates.forEach((d,i)=>{ const sw={id:uid(),date:d,routine:routine.id,plan:imp.planName,week:week+i*imp.weeks,time:rows[0].time,duration:rows[0].duration,done:false}; DB.scheduled.push(sw); created.push(sw); });
  }
  DB.scheduled.sort((a,b)=>a.date.localeCompare(b.date)); save(); return created;
}

// ---------- ICS ----------
function icsFor(items){
  const esc = s => s.replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LiftPlan//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:LiftPlan'];
  for(const s of items){ const r=DB.routines[s.routine]; const d=s.date.replace(/-/g,'');
    L.push('BEGIN:VEVENT',`UID:${s.id}@liftplan`,`DTSTAMP:${stamp}`);
    if(s.time){ const [h,m]=s.time.split(':').map(Number); const st=parseDay(s.date); st.setHours(h,m||0,0,0); const en=new Date(st.getTime()+s.duration*60000);
      const f=x=>x.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''); L.push(`DTSTART:${f(st)}`,`DTEND:${f(en)}`); }
    else L.push(`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${addDays(s.date,1).replace(/-/g,'')}`);
    L.push(`SUMMARY:${esc('🏋️ '+(r?r.name:'Workout'))}`,`DESCRIPTION:${esc(eventNotes(s))}`,'END:VEVENT'); }
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
function eventNotes(s){ const r=DB.routines[s.routine]; const out=[]; if(s.plan) out.push(`${s.plan} · Week ${s.week}`);
  for(const e of r?.exercises||[]){ let l=`• ${DB.exercises[e.ex]?.name}: ${e.sets}×${e.reps}`; if(e.weight) l+=` @ ${e.weight}`; if(e.rpe) l+=` RPE ${e.rpe}`; if(e.rest) l+=` · rest ${e.rest}s`; if(e.notes) l+=`\n    ${e.notes}`; out.push(l); }

        <div class="search"><span class="mag">⌕</span><input type="search" id="nbQ" placeholder="Search by name (e.g. Equinox)" value="${esc(STATE.nearbyQuery||'')}" autocomplete="off"></div>
        <div class="grp"><div class="inset"><div class="cell tap btn-cell" id="nbManual">＋ Add a Gym Manually</div></div><div class="foot">Map data © OpenStreetMap contributors.</div></div>`;
      body.querySelectorAll('[data-nb]').forEach(el=>el.onclick=()=>{ adoptNearby(STATE.nearby[+el.dataset.nb]); closeSheet(); });

function exStats(exId){ let best=0,last=null,n=0; for(const w of DB.workouts) for(const s of w.sets) if(s.ex===exId&&s.done){ n++; best=Math.max(best,e1rm(s)); if(!last||s.at>last.at) last=s; } return {best,last,n}; }

function renderActionBar(html){ let ab=document.getElementById('actionbar'); if(!html){ ab?.remove(); return; } if(!ab){ ab=document.createElement('div'); ab.id='actionbar'; ab.className='actionbar'; document.getElementById('app').appendChild(ab); } ab.innerHTML=html; }
function newRoutineObj(name){ const r={id:uid(),name,notes:'',color:PALETTE[Object.keys(DB.routines).length%PALETTE.length],exercises:[]}; DB.routines[r.id]=r; return r; }

function cv(c){ const r=c.getBoundingClientRect(); const dpr=devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr; const x=c.getContext('2d'); x.scale(dpr,dpr); const cs=getComputedStyle(document.documentElement); return {x,W:r.width,H:r.height,acc:cs.getPropertyValue('--tint').trim(),mut:cs.getPropertyValue('--sec').trim(),line:cs.getPropertyValue('--fill').trim(),fg:cs.getPropertyValue('--label').trim()}; }

  data.forEach((d,i)=>{ const h=(H-T-B)*d.v/max; x.fillStyle=acc; x.globalAlpha=i===data.length-1?1:.6; const rx=L+i*bw+3, rw=Math.max(2,bw-6); x.beginPath(); x.roundRect(rx,H-B-h,rw,h,[4,4,0,0]); x.fill(); x.globalAlpha=1; if(data.length<=10||i%Math.ceil(data.length/8)===0){ x.fillStyle=mut; x.textAlign='center'; x.fillText(d.label,L+i*bw+bw/2,H-6); } }); }

  const vs=data.map(d=>d.v); let lo=Math.min(...vs), hi=Math.max(...vs); const pad=(hi-lo)*.15||10; lo-=pad; hi+=pad; const L=36,B=22,T=12,R=12;
  x.strokeStyle=line; [0,.5,1].forEach(f=>{ const y=T+(H-T-B)*(1-f); x.beginPath(); x.moveTo(L,y); x.lineTo(W-R,y); x.stroke(); x.fillStyle=mut; x.textAlign='right'; x.fillText(Math.round(lo+(hi-lo)*f),L-4,y+4); });
  const px=i=>L+(W-L-R)*i/(data.length-1), py=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const grad=x.createLinearGradient(0,T,0,H-B); grad.addColorStop(0,acc+'44'); grad.addColorStop(1,acc+'00');
  x.beginPath(); data.forEach((d,i)=>i?x.lineTo(px(i),py(d.v)):x.moveTo(px(i),py(d.v))); x.lineTo(px(data.length-1),H-B); x.lineTo(px(0),H-B); x.closePath(); x.fillStyle=grad; x.fill();

  x.textAlign='right'; x.fillStyle=acc; x.font='600 12px -apple-system, system-ui, sans-serif'; x.fillText(Math.round(data[n].v),W-R,py(data[n].v)-9); }
function hbars(c,data){ const {x,W,H,acc,mut,fg}=cv(c); x.font='13px -apple-system, system-ui, sans-serif'; if(!data.length){ x.fillStyle=mut; x.fillText('No data in range',10,20); return; }
  const max=Math.max(...data.map(d=>d.v))||1, L=90, rh=H/data.length;
  data.forEach((d,i)=>{ const y=i*rh+4; x.fillStyle=fg; x.textAlign='right'; x.fillText(d.label,L-10,y+rh/2+1); x.fillStyle=acc; x.globalAlpha=.85; x.beginPath(); x.roundRect(L,y,(W-L-40)*d.v/max,rh-8,4); x.fill(); x.globalAlpha=1; x.fillStyle=mut; x.textAlign='left'; x.font=FM; x.fillText(d.v,L+(W-L-40)*d.v/max+6,y+rh/2+1); x.font='13px -apple-system, system-ui, sans-serif'; }); }

    <div class="grp"><h2>Plan CSV columns</h2><div class="inset"><div class="kv"><b>day</b><span>Mon…Sun or 2026-11-02 (required)</span><b>routine</b><span>workout name (required)</span><b>exercise</b><span>blank = schedule an existing routine</span><b>sets · reps</b><span>3 · "8", "8-12", "AMRAP"</span><b>weight · rpe</b><span>optional targets</span><b>rest</b><span>seconds, default 90</span><b>week</b><span>same routine with new numbers later → "Upper A (W3)"</span><b>time · duration</b><span>06:30 · minutes; blank time = all-day event</span><b>plan</b><span>block name; re-import replaces its schedule</span></div></div></div>
    <div class="grp"><div class="inset">${sampleCount?`<div class="cell tap btn-cell" id="rmSample">Remove Sample Data (${sampleCount} workouts)</div>`:''}<div class="cell tap btn-cell red" id="reset">Reset All Data</div></div><div class="foot">Data lives in this browser. On iPhone: Share → Add to Home Screen for a full-screen app. Build ${BUILD}.</div></div>
    <div class="grp"><h2>Photo credits</h2><div class="foot">Home photographs (1978–1992) via Wikimedia Commons: U.S. Marine Corps recruits lifting weights, 1988, and Marines aboard USS Kitty Hawk (U.S. Dept. of Defense, public domain); aerobics class, 1988 (U.S. government, public domain); crewman on exercise equipment, U.S. Navy (public domain); weightlifter František Nedvěd, 1979 (Czech National Archives, CC0); man at desk, 1981 (Nationaal Archief NL, CC0); Boston Marathon, 1980s (City of Boston Archives, CC BY 2.0); Kellie Everts, 1979 (public domain); Paris office, 1985 (public domain); estimating office, 1988 (CC BY 3.0); AutoCAD advertisement, 1987 (public domain); 1979 Moscow Olympics coin (public domain). Exercise photos: Free Exercise DB (public domain).</div></div>`;
  v.querySelector('#setGyms').onclick=gymsSheet;
  v.querySelector('#strongFile').onchange=ev=>{ const f=ev.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const r=importStrong(rd.result); toast(`Imported ${r.w} workouts, skipped ${r.d} duplicates`); render(); }catch(e){ toast(e.message); } }; rd.readAsText(f); };
  v.querySelector('#bkCopy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(DB)).then(()=>toast('Backup copied')).catch(()=>toast('Clipboard blocked'));
  v.querySelector('#bkPaste').onclick=()=>openSheet('Restore Backup',`<div class="grp"><div class="inset"><textarea id="bkText" placeholder="Paste JSON backup"></textarea></div></div>`,h=>{ h.querySelector('#shDone').onclick=()=>{ try{ const d=JSON.parse(h.querySelector('#bkText').value); if(!d.exercises||!d.routines) throw 0; DB=d; save(); closeSheet(); toast('Restored'); render(); }catch(e){ toast('Not a LiftPlan backup'); } }; },{done:'Restore'});
  v.querySelector('#tplCopy').onclick=()=>navigator.clipboard.writeText(SAMPLE_PLAN.split('\n').slice(0,3).join('\n')).then(()=>toast('Template copied')).catch(()=>toast('Clipboard blocked'));
  v.querySelector('#rmSample')?.addEventListener('click',()=>{ DB.workouts=DB.workouts.filter(w=>!w.sample); DB.scheduled=DB.scheduled.filter(s=>s.plan!=='Fall Strength Block'); Object.values(DB.gyms).filter(g=>g.sample).forEach(g=>{ delete DB.gyms[g.id]; if(DB.settings.currentGym===g.id) DB.settings.currentGym=null; }); save(); toast('Sample data removed'); render(); });
  v.querySelector('#reset').onclick=()=>openSheet('Reset All Data?',`<div class="grp"><div class="inset"><div class="cell tap btn-cell red" id="rsGo">Delete Everything</div></div><div class="foot">All routines, schedule and history in this browser will be deleted.</div></div>`,h=>{ h.querySelector('#rsGo').onclick=()=>{ try{localStorage.removeItem(KEY);}catch(e){} location.reload(); }; });
  v.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{DB.settings.unit=b.dataset.unit;save();render();});
}
function importStrong(text){
  const rows=parseCSV(text); if(!rows.length||!('exercise name' in rows[0])||!('set order' in rows[0])) throw new Error('Not a Strong export');
  const keys=new Set(DB.workouts.filter(w=>w.imported).map(w=>w.startedAt+'|'+w.name)); const groups=new Map();
  for(const r of rows){ const d=new Date(r.date.replace(' ','T')); if(isNaN(d)) continue; const k=d.getTime()+'|'+(r['workout name']||'Workout'); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r); }
  let w=0,dups=0;
  for(const [k,rs] of groups){ if(keys.has(k)){dups++;continue;} const [t,name]=[+k.split('|')[0],k.split('|').slice(1).join('|')];
    const durS=rs[0]['workout duration']||rs[0]['duration']||''; const m=durS.match(/(\d+)h/),n=durS.match(/(\d+)m/); const dur=((m?+m[1]*3600:0)+(n?+n[1]*60:0))||3600;
    const wk={id:uid(),name,startedAt:t,endedAt:t+dur*1000,notes:rs[0]['workout notes']||'',imported:true,sets:[]}; const ord={}, idx={};
    for(const r of rs){ if(!/^\d+$/.test(r['set order'])) continue; const ex=findOrCreateEx(r['exercise name']); if(ord[ex.id]===undefined) ord[ex.id]=Object.keys(ord).length; let wt=parseFloat(r.weight)||0; const u=(r['weight unit']||'').toLowerCase(); if(u&&u!==DB.settings.unit) wt=u==='kg'?wt*2.20462:wt/2.20462;
      wk.sets.push({id:uid(),ex:ex.id,order:ord[ex.id],idx:idx[ex.id]=(idx[ex.id]??-1)+1,weight:Math.round(wt*10)/10,reps:parseInt(r.reps)||0,rpe:parseFloat(r.rpe)||null,done:true,at:t}); }
    DB.workouts.push(wk); w++; }
  save(); return {w,d:dups};
}

// ---------- Boot ----------
(function tickStatus(){ const el=document.getElementById('stTime'); if(el) el.textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M/i,''); setTimeout(tickStatus,30000); })();
if(!load() || !DB.meta?.seeded) seed(); else { DB.gyms??={}; DB.settings.currentGym??=null; ensureLibrary(); save(); }
loadNearby(); if(STATE.nearby.length) STATE.nearbyState='ok';
render();
</script>
