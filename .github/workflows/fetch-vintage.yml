name: Fetch vintage photo candidates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/fetch_by_category.py candidates
      - name: Commit candidates to review branch
        run: |
          git config user.name "liftplan-bot" && git config user.email "bot@users.noreply.github.com"
          git checkout -B vintage-candidates
          git add candidates && git commit -m "Vintage photo candidates from Wikimedia Commons" || echo "nothing to commit"
          git push -f origin vintage-candidates
