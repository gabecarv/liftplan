name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch curated vintage photos (public domain, Wikimedia Commons)
        run: pip install -q pillow && python tools/fetch_vintage.py
      - name: Commit fetched photos so later deploys skip the download
        run: |
          git config user.name "liftplan-bot" && git config user.email "bot@users.noreply.github.com"
          git add images/vintage* && (git diff --cached --quiet || (git commit -m "Add fetched vintage photos" && git push origin HEAD:main)) || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
